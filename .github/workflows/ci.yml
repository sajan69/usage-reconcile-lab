name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install built package
        run: |
          python -m pip install .
          python -m pip check
      - name: Validate contracts, transactions and CLI
        run: |
          python -m unittest discover -v
          usage-reconcile --version
          usage-reconcile demo
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - run: npm ci --prefix browser --ignore-scripts
      - run: npx --prefix browser playwright install --with-deps chromium
      - name: Build synthetic reports and check actual browser rendering
        run: |
          usage-reconcile demo-comparison --out browser/artifacts
          python browser/probe.py
          npm test --prefix browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-report-browser
          path: browser/artifacts
